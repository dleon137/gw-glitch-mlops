name: CI

# Runs the offline unit test suite on push/PR. Network-dependent tests
# (real GWOSC/Zenodo downloads) are marked `network` and skipped here by
# default (see pytest.ini) — Week 4 may add a scheduled job that runs
# them separately against live data.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (offline only)
        run: pytest tests/ -v
